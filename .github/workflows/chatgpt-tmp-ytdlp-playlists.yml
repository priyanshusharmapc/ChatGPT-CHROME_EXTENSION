name: chatgpt-temp-id-candidates

on:
  push:
    branches:
      - chatgpt-tmp-yt-dlp-20260819
    paths:
      - .github/workflows/chatgpt-tmp-ytdlp-playlists.yml

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-tmp-yt-dlp-20260819
          fetch-depth: 1
      - name: Select concise candidate evidence
        shell: bash
        run: |
          python - <<'PY'
          import csv,re
          from collections import defaultdict

          rows=defaultdict(list)
          with open('chatgpt-id-websearch.tsv',encoding='utf-8',newline='') as f:
              for r in csv.DictReader(f,delimiter='\t'):
                  rows[(r['playlist'],int(r['position']),r['id'])].append(r)

          def score(r,vid):
              title=r['result_title'].lower(); snip=r['snippet'].lower(); url=r['url'].lower()
              s=0
              if vid.lower() in snip or vid.lower() in title: s+=5
              if 'duckduckgo.com' in url: s+=3
              if 'youtube' in r['result_title'].lower(): s+=1
              if any(x in title for x in ['github','amazon','reddit','documentation','phone specifications']): s-=4
              if any(x in snip for x in ['song','music','bgm','theme','soundtrack','original','background']): s+=2
              return s

          out=[]
          for key,items in sorted(rows.items(), key=lambda kv:(kv[0][0],kv[0][1])):
              pl,pos,vid=key
              ranked=sorted(items,key=lambda r:(-score(r,vid),int(r['rank'])))[:3]
              cells=[]
              for r in ranked:
                  t=re.sub(r'\s+',' ',r['result_title']).strip().replace('\t',' ')
                  s=re.sub(r'\s+',' ',r['snippet']).strip().replace('\t',' ')
                  cells.append(f"{t} :: {s}")
              out.append([pl,pos,vid]+cells+['']*(3-len(cells)))

          with open('chatgpt-id-candidates.tsv','w',encoding='utf-8',newline='') as f:
              w=csv.writer(f,delimiter='\t',lineterminator='\n')
              w.writerow(['playlist','position','id','candidate1','candidate2','candidate3'])
              w.writerows(out)
          print('candidate ids',len(out))
          PY
      - name: Commit candidates
        shell: bash
        run: |
          git config user.name 'chatgpt-temp-bot'
          git config user.email 'chatgpt-temp-bot@users.noreply.github.com'
          git add chatgpt-id-candidates.tsv
          git commit -m 'Temporary concise recovery candidates' || exit 0
          git push origin HEAD:chatgpt-tmp-yt-dlp-20260819
