name: chatgpt-temp-id-websearch

on:
  push:
    branches:
      - chatgpt-tmp-yt-dlp-20260819
    paths:
      - .github/workflows/chatgpt-tmp-ytdlp-playlists.yml

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-tmp-yt-dlp-20260819
          fetch-depth: 1
      - run: python -m pip install requests beautifulsoup4
      - name: Exact-ID search
        shell: bash
        run: |
          python - <<'PY'
          import csv, re, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import quote, urlparse, parse_qs, unquote
          import requests
          from bs4 import BeautifulSoup

          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125 Safari/537.36'}
          ids=[]
          for key in ('p1','p2'):
              with open(f'chatgpt-{key}-unavailable.tsv',encoding='utf-8',newline='') as f:
                  for row in csv.DictReader(f,delimiter='\t'):
                      if row['title']=='(no title)': ids.append((key,row['position'],row['id']))

          def clean(s): return re.sub(r'\s+',' ',s or '').strip()

          def bing(vid):
              q=quote('"'+vid+'" YouTube')
              url='https://www.bing.com/search?q='+q+'&count=8'
              try:
                  r=requests.get(url,headers=headers,timeout=12)
                  soup=BeautifulSoup(r.text,'html.parser')
                  out=[]
                  for li in soup.select('li.b_algo')[:6]:
                      a=li.select_one('h2 a')
                      p=li.select_one('.b_caption p')
                      if a:
                          out.append((clean(a.get_text(' ',strip=True)),clean(p.get_text(' ',strip=True) if p else ''),a.get('href','')))
                  return out
              except Exception: return []

          def ddg(vid):
              q=quote('"'+vid+'"')
              url='https://html.duckduckgo.com/html/?q='+q
              try:
                  r=requests.get(url,headers=headers,timeout=12)
                  soup=BeautifulSoup(r.text,'html.parser')
                  out=[]
                  for res in soup.select('.result')[:6]:
                      a=res.select_one('.result__a')
                      s=res.select_one('.result__snippet')
                      if a:
                          out.append((clean(a.get_text(' ',strip=True)),clean(s.get_text(' ',strip=True) if s else ''),a.get('href','')))
                  return out
              except Exception: return []

          def work(item):
              key,pos,vid=item
              b=bing(vid); d=ddg(vid)
              merged=[]; seen=set()
              for x in b+d:
                  sig=(x[0],x[2])
                  if sig not in seen:
                      seen.add(sig); merged.append(x)
              return key,pos,vid,merged[:8]

          rows=[]
          with ThreadPoolExecutor(max_workers=8) as ex:
              futs=[ex.submit(work,x) for x in ids]
              for fut in as_completed(futs):
                  key,pos,vid,res=fut.result()
                  for rank,(title,snip,url) in enumerate(res,1):
                      rows.append((key,int(pos),vid,rank,title,snip,url))
          rows.sort(key=lambda x:(x[0],x[1],x[3]))
          with open('chatgpt-id-websearch.tsv','w',encoding='utf-8',newline='') as f:
              w=csv.writer(f,delimiter='\t',lineterminator='\n')
              w.writerow(['playlist','position','id','rank','result_title','snippet','url'])
              w.writerows(rows)
          print('ids',len(ids),'result rows',len(rows))
          PY
      - name: Commit search evidence
        shell: bash
        run: |
          git config user.name 'chatgpt-temp-bot'
          git config user.email 'chatgpt-temp-bot@users.noreply.github.com'
          git add chatgpt-id-websearch.tsv
          git commit -m 'Temporary exact-ID web search evidence' || exit 0
          git push origin HEAD:chatgpt-tmp-yt-dlp-20260819
