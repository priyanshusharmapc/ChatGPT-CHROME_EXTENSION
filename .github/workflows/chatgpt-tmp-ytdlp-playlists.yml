              '93fAJe8WVjA': 'Steppenwolf - Born To Be Wild [hard rock]',
              'VJDXOWqs_HI': 'Hans Zimmer - Beautiful Lie (Batman v Superman: Dawn of Justice Soundtrack) [film score]',
              'bte1rCN7sQg': 'Louis Lion - Distance',
              'U6Pm0iVvFXs': "Coolio - Gangsta's Paradise [hip-hop]",
              'hMts_vK-arQ': "Rob Dougan - I'm Not Driving Anymore (Rollo's Mix / Instrumental)",
              'wi8X0ziGcqI': 'Nightshift TV - Drive Forever',

              # S playlist, all seven hidden entries.
              'ZcaWPrhgFeA': 'Memphis Cult, Groove Dealers & SPLYXER - For the Nigguz [Memphis phonk/hip-hop]',
              'e-7lBX_7MYM': 'Owen Cropper - NASTY (Slowed Loop)',
              '_KAK3H63py0': 'PsycoTune - NO BATIDÃO (Ultra Slowed)',
              'ge1mZ_CoGqs': 'Testosterone - Woops Warhammer',
              'uOpt3eUvQEU': 'alt-J - Tessellate [indietronica/art rock/trip hop]',
              'ICcNkseFQXg': 'mikeeysmind & 725 - Molly (Guitar Rmx) [alternative]',
          }

          override = dict(known_overrides)
          override.update(missing_overrides)

          def parse_all(path):
              rows=[]
              for raw in Path(path).read_text(encoding='utf-8').splitlines():
                  if not raw.strip():
                      continue
                  m=re.match(r'^(.*) - https://www\.youtube\.com/watch\?v=([^\s]+)$', raw)
                  if not m:
                      raise ValueError(f'Cannot parse line: {raw!r}')
                  rows.append((m.group(2),m.group(1)))
              return rows

          def parse_unavail(path):
              rows=[]
              with open(path,encoding='utf-8',newline='') as f:
                  for r in csv.DictReader(f,delimiter='\t'):
                      rows.append((r['id'],r['title']))
              return rows

          def final_title(vid, original):
              return override.get(vid, original or '(no title)')

          def write_lines(rows,path):
              Path(path).parent.mkdir(parents=True,exist_ok=True)
              Path(path).write_text('\n'.join(
                  f"{final_title(vid,title)} - https://www.youtube.com/watch?v={vid}" for vid,title in rows
              )+'\n',encoding='utf-8')

          p1_all=parse_all('chatgpt-p1-all.txt')
          p2_all=parse_all('chatgpt-p2-all.txt')
          p1_un=parse_unavail('chatgpt-p1-unavailable.tsv')
          p2_un=parse_unavail('chatgpt-p2-unavailable.tsv')

          write_lines(p1_all,'out/Songs/SONGS - all videos.txt')
          write_lines(p1_un,'out/Songs/SONGS - unavailable videos.txt')
          write_lines(p2_all,'out/S/S - all videos.txt')
          write_lines(p2_un,'out/S/S - unavailable videos.txt')

          def stats(all_rows, un_rows):
              missing=[vid for vid,title in un_rows if not title or title=='(no title)']
              recovered=[vid for vid in missing if vid in missing_overrides]
              unresolved=[vid for vid in missing if vid not in missing_overrides]
              return {
                  'total_videos':len(all_rows),
                  'unavailable_videos':len(un_rows),
                  'missing_titles_initial':len(missing),
                  'missing_titles_recovered':len(recovered),
                  'missing_titles_unrecoverable':len(unresolved),
                  'recovered_ids':recovered,
                  'unrecoverable_ids':unresolved,
              }

          report={
              'SONGS':stats(p1_all,p1_un),
              'S':stats(p2_all,p2_un),
              'notes':{
                  'method':'normal yt-dlp extraction minus --compat-options no-youtube-unavailable-videos',
                  'wayback_title_recoveries':0,
                  'recovery_basis':'high-confidence exact-video-ID public web evidence; uncertain matches left as (no title)',
              }
          }
          Path('out/recovery-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

          test "$(wc -l < 'out/Songs/SONGS - all videos.txt')" -eq 1713
          test "$(wc -l < 'out/Songs/SONGS - unavailable videos.txt')" -eq 139
          test "$(wc -l < 'out/S/S - all videos.txt')" -eq 253
          test "$(wc -l < 'out/S/S - unavailable videos.txt')" -eq 7

      - name: Upload final bundle
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-final-playlist-files
          path: out/
          if-no-files-found: error
          retention-days: 1
