          }

          # Artist/source enrichment for ambiguous or generic titles whose uploader/artist
          # was retained by yt-dlp or confirmed by search. This is intentionally selective.
          known_overrides = {
              'mQXb6Gp1h9U': 'syncmusic - NO SIGNAL Eclipse',
              'vYn1b8gcmrY': 'Samrai Blade - FAAAHHH',
              'gsG6jkkuC00': 'Skryptonite - Цепи (feat. 104)',
