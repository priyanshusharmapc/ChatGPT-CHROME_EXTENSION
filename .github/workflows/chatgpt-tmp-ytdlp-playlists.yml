name: chatgpt-temp-final-playlist-files

on:
  push:
    branches:
      - chatgpt-tmp-yt-dlp-20260819
    paths:
      - .github/workflows/chatgpt-tmp-ytdlp-playlists.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-tmp-yt-dlp-20260819
          fetch-depth: 1

      - name: Build requested files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, re
          from pathlib import Path

          # High-confidence recoveries for entries yt-dlp exposes without a title.
