name: chatgpt-temp-ytdlp-playlists

on:
  push:
    branches:
      - chatgpt-tmp-yt-dlp-20260819
    paths:
      - .github/workflows/chatgpt-tmp-ytdlp-playlists.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Install tools
        run: python -m pip install --upgrade yt-dlp requests beautifulsoup4

      - name: Extract both playlists twice and build staging files
        shell: bash
        run: |
          set -euo pipefail
          P1='https://www.youtube.com/playlist?list=PLIV1G--hNI58vN4-NJ33JuE2JNDc8Bq4G'
          P2='https://www.youtube.com/playlist?list=PL8zgWQ7EPbOdRn7mXLWoa0DqfbcIbJnjx'

          yt-dlp --flat-playlist --ignore-errors --dump-single-json "$P1" > p1-full.json
          yt-dlp --flat-playlist --ignore-errors --dump-single-json --compat-options no-youtube-unavailable-videos "$P1" > p1-available.json
          yt-dlp --flat-playlist --ignore-errors --dump-single-json "$P2" > p2-full.json
          yt-dlp --flat-playlist --ignore-errors --dump-single-json --compat-options no-youtube-unavailable-videos "$P2" > p2-available.json

          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def clean(e, pos):
              if not e:
                  return {'position': pos, 'id': None, 'title': None}
              return {'position': e.get('playlist_index') or pos, 'id': e.get('id'), 'title': e.get('title')}

          counts = {}
          for key in ('p1', 'p2'):
              full = load(f'{key}-full.json')
              avail = load(f'{key}-available.json')
              full_entries = [clean(e, i) for i, e in enumerate(full.get('entries') or [], 1)]
              avail_entries = [clean(e, i) for i, e in enumerate(avail.get('entries') or [], 1)]
              avail_ids = {e['id'] for e in avail_entries if e.get('id')}
              unavailable = [e for e in full_entries if e.get('id') and e['id'] not in avail_ids]

              counts[key] = {
                  'playlist_id': full.get('id'),
                  'playlist_title': full.get('title'),
                  'full_count': len(full_entries),
                  'available_count': len(avail_entries),
                  'unavailable_count': len(unavailable),
                  'missing_title_count': sum(1 for e in unavailable if not e.get('title')),
              }

              Path(f'chatgpt-{key}-all.txt').write_text('\n'.join(
                  f"{e.get('title') or '(no title)'} - https://www.youtube.com/watch?v={e['id']}"
                  for e in full_entries if e.get('id')
              ) + '\n', encoding='utf-8')

              Path(f'chatgpt-{key}-unavailable.txt').write_text('\n'.join(
                  f"{e.get('title') or '(no title)'} - https://www.youtube.com/watch?v={e['id']}"
                  for e in unavailable
              ) + '\n', encoding='utf-8')

              Path(f'chatgpt-{key}-unavailable.tsv').write_text(
                  'position\tid\ttitle\n' + '\n'.join(
                      f"{e['position']}\t{e['id']}\t{e.get('title') or '(no title)'}" for e in unavailable
                  ) + '\n', encoding='utf-8')

          Path('chatgpt-counts.json').write_text(json.dumps(counts, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(counts, ensure_ascii=False, indent=2))
          PY

      - name: Recover missing titles from Wayback Machine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, html, re, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from bs4 import BeautifulSoup

          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0 ChatGPT playlist title recovery/1.0'})

          GENERIC = {
              'youtube', 'youtube - broadcast yourself.', 'youtube - broadcast yourself',
              'video unavailable', 'private video', 'deleted video', 'this video is unavailable',
              'youtube - google'
          }

          def normalize_title(value):
              if not value:
                  return None
              value = html.unescape(value).strip()
              value = re.sub(r'\s+', ' ', value)
              value = re.sub(r'\s*-\s*YouTube\s*$', '', value, flags=re.I).strip()
              low = value.lower().strip(' .')
              if not value or low in GENERIC or low.startswith('youtube error'):
                  return None
              if 'video unavailable' in low or 'private video' in low or 'deleted video' in low:
                  return None
              return value

          def cdx_snapshots(video_id):
              variants = [
                  f'https://www.youtube.com/watch?v={video_id}',
                  f'http://www.youtube.com/watch?v={video_id}',
                  f'https://youtube.com/watch?v={video_id}',
                  f'http://youtube.com/watch?v={video_id}',
                  f'https://m.youtube.com/watch?v={video_id}',
              ]
              seen = set()
              snaps = []
              for original in variants:
                  url = ('https://web.archive.org/cdx/search/cdx?url=' + quote(original, safe='') +
                         '&output=json&fl=timestamp,original,statuscode,mimetype&filter=statuscode:200'
                         '&filter=mimetype:text/html&collapse=digest&limit=12')
                  try:
                      r = session.get(url, timeout=20)
                      if r.status_code != 200:
                          continue
                      data = r.json()
                      for row in data[1:]:
                          if len(row) < 2:
                              continue
                          ts, orig = row[0], row[1]
                          key = (ts, orig)
                          if key not in seen:
                              seen.add(key)
                              snaps.append(key)
                  except Exception:
                      pass
              snaps.sort(key=lambda x: x[0])
              return snaps[:15]

          def recover(video_id):
              snaps = cdx_snapshots(video_id)
              earliest = snaps[0][0] if snaps else ''
              for ts, orig in snaps[:8]:
                  snap = f'https://web.archive.org/web/{ts}id_/{orig}'
                  try:
                      r = session.get(snap, timeout=25)
                      if r.status_code != 200 or not r.text:
                          continue
                      soup = BeautifulSoup(r.text, 'html.parser')
                      candidates = []
                      og = soup.find('meta', attrs={'property': 'og:title'})
                      if og and og.get('content'):
                          candidates.append(og.get('content'))
                      tw = soup.find('meta', attrs={'name': 'twitter:title'})
                      if tw and tw.get('content'):
                          candidates.append(tw.get('content'))
                      if soup.title and soup.title.string:
                          candidates.append(soup.title.string)
                      for raw in candidates:
                          title = normalize_title(raw)
                          if title:
                              return {'id': video_id, 'title': title, 'snapshot': snap, 'earliest': earliest, 'status': 'recovered'}
                  except Exception:
                      pass
              return {'id': video_id, 'title': '', 'snapshot': '', 'earliest': earliest, 'status': 'not found' if snaps else 'no snapshots'}

          missing = []
          for key in ('p1', 'p2'):
              with open(f'chatgpt-{key}-unavailable.tsv', encoding='utf-8', newline='') as f:
                  for row in csv.DictReader(f, delimiter='\t'):
                      if row['title'] == '(no title)':
                          missing.append((key, row['position'], row['id']))

          results = {}
          with ThreadPoolExecutor(max_workers=4) as pool:
              futs = {pool.submit(recover, vid): (key, pos, vid) for key, pos, vid in missing}
              for fut in as_completed(futs):
                  key, pos, vid = futs[fut]
                  try:
                      rec = fut.result()
                  except Exception:
                      rec = {'id': vid, 'title': '', 'snapshot': '', 'earliest': '', 'status': 'error'}
                  results[(key, vid)] = (pos, rec)
                  print(key, vid, rec['status'], rec.get('title',''))

          lines = ['playlist\tposition\tid\trecovered_title\tearliest_snapshot_date\tevidence_url\tstatus']
          for key, pos, vid in missing:
              _, rec = results.get((key, vid), (pos, {'title':'','earliest':'','snapshot':'','status':'error'}))
              earliest = rec.get('earliest','')[:8]
              if len(earliest) == 8:
                  earliest = earliest[:4] + '-' + earliest[4:6] + '-' + earliest[6:8]
              lines.append('\t'.join([key, str(pos), vid, rec.get('title','').replace('\t',' '), earliest, rec.get('snapshot',''), rec.get('status','')]))
          Path('chatgpt-wayback-recovery.tsv').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit staging and recovery results to temp branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ytdlp-result-repo
          git clone --depth=1 --branch chatgpt-tmp-yt-dlp-20260819 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/ytdlp-result-repo
          cp "$GITHUB_WORKSPACE"/chatgpt-counts.json /tmp/ytdlp-result-repo/
          cp "$GITHUB_WORKSPACE"/chatgpt-p1-all.txt /tmp/ytdlp-result-repo/
          cp "$GITHUB_WORKSPACE"/chatgpt-p1-unavailable.txt /tmp/ytdlp-result-repo/
          cp "$GITHUB_WORKSPACE"/chatgpt-p1-unavailable.tsv /tmp/ytdlp-result-repo/
          cp "$GITHUB_WORKSPACE"/chatgpt-p2-all.txt /tmp/ytdlp-result-repo/
          cp "$GITHUB_WORKSPACE"/chatgpt-p2-unavailable.txt /tmp/ytdlp-result-repo/
          cp "$GITHUB_WORKSPACE"/chatgpt-p2-unavailable.tsv /tmp/ytdlp-result-repo/
          cp "$GITHUB_WORKSPACE"/chatgpt-wayback-recovery.tsv /tmp/ytdlp-result-repo/
          cd /tmp/ytdlp-result-repo
          git config user.name 'chatgpt-temp-bot'
          git config user.email 'chatgpt-temp-bot@users.noreply.github.com'
          git add chatgpt-counts.json chatgpt-p1-all.txt chatgpt-p1-unavailable.txt chatgpt-p1-unavailable.tsv chatgpt-p2-all.txt chatgpt-p2-unavailable.txt chatgpt-p2-unavailable.tsv chatgpt-wayback-recovery.tsv
          git commit -m 'Temporary yt-dlp and Wayback recovery results' || true
          git push origin HEAD:chatgpt-tmp-yt-dlp-20260819
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
