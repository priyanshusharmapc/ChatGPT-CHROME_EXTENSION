              'XUhVCoTsBaM': "JoJo's Bizarre Adventure - Awaken (Pillar Men Theme) [anime soundtrack]",
              'fOsB5AoKDJc': 'Mick Gordon - The Only Thing They Fear Is You (DOOM Eternal) [video game soundtrack/industrial metal]',
