name: chatgpt-temp-wayback-recovery

on:
  push:
    branches:
      - chatgpt-tmp-yt-dlp-20260819
    paths:
      - .github/workflows/chatgpt-tmp-ytdlp-playlists.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-tmp-yt-dlp-20260819
          fetch-depth: 1

      - name: Install archive helpers
        run: python -m pip install requests beautifulsoup4

      - name: Recover missing titles
        shell: bash
        run: |
          python - <<'PY'
          import csv, html, re
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from bs4 import BeautifulSoup

          headers = {'User-Agent': 'Mozilla/5.0 ChatGPT playlist title recovery/1.0'}
          generic = {'youtube','youtube - broadcast yourself.','youtube - broadcast yourself','video unavailable','private video','deleted video','this video is unavailable'}

          def norm(v):
              if not v: return None
              v = re.sub(r'\s+', ' ', html.unescape(v)).strip()
              v = re.sub(r'\s*-\s*YouTube\s*$', '', v, flags=re.I).strip()
              low = v.lower().strip(' .')
              if not v or low in generic or 'video unavailable' in low or 'private video' in low or 'deleted video' in low:
                  return None
              return v

          def recover(vid):
              canonical = f'https://www.youtube.com/watch?v={vid}'
              cdx = ('https://web.archive.org/cdx/search/cdx?url=' + quote(canonical, safe='') +
                     '&output=json&fl=timestamp,original&filter=statuscode:200&filter=mimetype:text/html&collapse=digest&limit=6')
              try:
                  r = requests.get(cdx, headers=headers, timeout=10)
                  if r.status_code != 200:
                      return ('', '', '', 'cdx blocked')
                  data = r.json()
              except Exception:
                  return ('', '', '', 'cdx error')
              rows = data[1:] if isinstance(data, list) and data else []
              if not rows:
                  return ('', '', '', 'no snapshots')
              earliest = rows[0][0]
              for row in rows[:4]:
                  ts, orig = row[0], row[1]
                  snap = f'https://web.archive.org/web/{ts}id_/{orig}'
                  try:
                      p = requests.get(snap, headers=headers, timeout=10)
                      if p.status_code != 200 or not p.text:
                          continue
                      soup = BeautifulSoup(p.text, 'html.parser')
                      cand = []
                      for attrs in ({'property':'og:title'}, {'name':'twitter:title'}):
                          m = soup.find('meta', attrs=attrs)
                          if m and m.get('content'): cand.append(m.get('content'))
                      if soup.title and soup.title.string: cand.append(soup.title.string)
                      for raw in cand:
                          title = norm(raw)
                          if title:
                              return (title, earliest, snap, 'recovered')
                  except Exception:
                      pass
              return ('', earliest, '', 'not found')

          missing = []
          for key in ('p1','p2'):
              with open(f'chatgpt-{key}-unavailable.tsv', encoding='utf-8', newline='') as f:
                  for row in csv.DictReader(f, delimiter='\t'):
                      if row['title'] == '(no title)':
                          missing.append((key, row['position'], row['id']))

          found = {}
          with ThreadPoolExecutor(max_workers=16) as ex:
              futs = {ex.submit(recover, vid):(key,pos,vid) for key,pos,vid in missing}
              for fut in as_completed(futs):
                  key,pos,vid = futs[fut]
                  try: found[(key,vid)] = fut.result()
                  except Exception: found[(key,vid)] = ('','','','error')

          lines = ['playlist\tposition\tid\trecovered_title\tearliest_snapshot_date\tevidence_url\tstatus']
          for key,pos,vid in missing:
              title, earliest, evidence, status = found.get((key,vid), ('','','','error'))
              date = ''
              if len(earliest) >= 8:
                  date = f'{earliest[:4]}-{earliest[4:6]}-{earliest[6:8]}'
              lines.append('\t'.join([key,str(pos),vid,title.replace('\t',' '),date,evidence,status]))
          Path('chatgpt-wayback-recovery.tsv').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print('missing', len(missing), 'recovered', sum(1 for x in found.values() if x[3]=='recovered'))
          PY

      - name: Commit recovery file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-temp-bot'
          git config user.email 'chatgpt-temp-bot@users.noreply.github.com'
          git add chatgpt-wayback-recovery.tsv
          git commit -m 'Temporary fast Wayback recovery results' || exit 0
          git push origin HEAD:chatgpt-tmp-yt-dlp-20260819
