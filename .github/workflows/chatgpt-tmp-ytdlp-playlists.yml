              '443p6mmPCwk': 'Sluwøp - Menace 1 (Slowed + Reverb)',
              'p5J7afpqcPY': 'MXZI - MONTAGEM XONADA (Slowed)',
              'xflREqoH8To': 'DJ Asul - NO ERA AMOR (Super Slowed)',
              '4BPSpabKjA8': 'DJ Asul - NO ERA AMOR (Extremely Slowed)',
              'ij8RkC6dLn0': 'Clint Mansell - Marion Barfs',
              'qePI5n1eF30': 'Blast Off Music - Dark Future',
              'drDn2BwEYcw': 'DJ Asul - NO ERA AMOR (Slowed)',
              '3b71vtXtgF8': 'Lunar Spark - Drizzling Serenity',
              'aaLADvBZaxA': 'Sayfalse - COM MEDO! (Super Slowed)',
              'IOrKYzOGzg0': "Bare Up - Can't Stop",
              'ygFUzZFL-r0': 'Hexora - BLAH',
              'HyklZmIjQRk': 'Kobe Mane - Olympo Rave',
              'GTIBcSOB31k': "O.D. - Don't Play That",
              'PkNtBuwWq_o': 'Peter Gabriel - My Body Is A Cage',
              'G7OOJs0qCU0': 'Blast Off Music - Nebula',
              '_FGVfpIjjCI': 'Lumea - Drift Beyond Clarity',
              'VncGDqIbNVQ': 'ALXIKE - FUNK ESTRANHO (SUPER SLOWED)',
              'CWpQs-qXi9c': 'SAD PHONK - Starlight Journey',
              'FTpHsPwSm7g': 'Zardonic - Raise Hell (Original Mix)',
              'zdpWmqBIs1w': 'Blast Off Music - Horizon',
              'vPqO67DZxlk': 'LONOWN - AVANGARD (Slowed)',
              'AdDgDktxiRU': 'East Duo - ჩუბინა',
              'GQwBXef55D8': 'ByAstral - WHOOPS!',
              'w_VQJBWvJcI': 'MVSTERIOUS - SLAVA FUNK!',
              'YW2LC4ovrd4': 'ptasinski - life force',
              '9o8d2HZE0Yc': 'visioner. - Menace (Slowed + Reverb)',
              'Ksk2obagexs': 'Digital Bridge - Rolling Thunder',
              'm4PODtj-TOg': 'vicX - 9 Am',
              'tI2ZSqtikrk': 'The Soul Mate - Malevolent Chant',
              'q5ncE4wIvfw': 'Ogryzek - GLORY [phonk]',
              'ktkK6vlS9JU': 'Los Coast - Simplify',
              'bekns9G2eCI': 'Digital Bridge - Frozen Gaze (Acoustic Version)',
              '63pWZhYg7PA': 'mori - First Blood',
              'LL0z-EiJbMI': 'AnyMindMusic Library - The Begin (Dramatic)',
              'tJTjr_suT1g': 'Gibran Alcocer - Idea 22',
              'OHw5I5JIVc8': 'Gibran Alcocer - Idea 22 (Slowed + Reverb)',
