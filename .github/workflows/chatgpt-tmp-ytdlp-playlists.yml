name: chatgpt-temp-unavailable-metadata

on:
  push:
    branches:
      - chatgpt-tmp-yt-dlp-20260819
    paths:
      - .github/workflows/chatgpt-tmp-ytdlp-playlists.yml

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-tmp-yt-dlp-20260819
          fetch-depth: 1
      - run: python -m pip install --upgrade yt-dlp
      - name: Extract unavailable entry metadata
        shell: bash
        run: |
          set -euo pipefail
          P1='https://www.youtube.com/playlist?list=PLIV1G--hNI58vN4-NJ33JuE2JNDc8Bq4G'
          P2='https://www.youtube.com/playlist?list=PL8zgWQ7EPbOdRn7mXLWoa0DqfbcIbJnjx'
          yt-dlp --flat-playlist --ignore-errors --dump-single-json "$P1" > meta-p1-full.json
          yt-dlp --flat-playlist --ignore-errors --dump-single-json --compat-options no-youtube-unavailable-videos "$P1" > meta-p1-avail.json
          yt-dlp --flat-playlist --ignore-errors --dump-single-json "$P2" > meta-p2-full.json
          yt-dlp --flat-playlist --ignore-errors --dump-single-json --compat-options no-youtube-unavailable-videos "$P2" > meta-p2-avail.json
          python - <<'PY'
          import csv,json
          from pathlib import Path
          out=[]
          fields=['playlist','position','id','title','channel','channel_id','uploader','uploader_id','artist','album','release_year','availability']
          for key in ('p1','p2'):
              full=json.loads(Path(f'meta-{key}-full.json').read_text())
              av=json.loads(Path(f'meta-{key}-avail.json').read_text())
              av_ids={e.get('id') for e in (av.get('entries') or []) if e}
              for i,e in enumerate(full.get('entries') or [],1):
                  if not e or not e.get('id') or e.get('id') in av_ids: continue
                  out.append({
                    'playlist':key,'position':e.get('playlist_index') or i,'id':e.get('id'),
                    'title':e.get('title') or '(no title)','channel':e.get('channel') or '',
                    'channel_id':e.get('channel_id') or '', 'uploader':e.get('uploader') or '',
                    'uploader_id':e.get('uploader_id') or '', 'artist':e.get('artist') or '',
                    'album':e.get('album') or '', 'release_year':e.get('release_year') or '',
                    'availability':e.get('availability') or ''})
          with open('chatgpt-unavailable-metadata.tsv','w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,delimiter='\t',lineterminator='\n'); w.writeheader(); w.writerows(out)
          print('rows',len(out),'with channel',sum(1 for r in out if r['channel'] or r['uploader'] or r['artist']))
          PY
      - name: Commit metadata
        shell: bash
        run: |
          git config user.name 'chatgpt-temp-bot'
          git config user.email 'chatgpt-temp-bot@users.noreply.github.com'
          git add chatgpt-unavailable-metadata.tsv
          git commit -m 'Temporary unavailable uploader metadata' || exit 0
          git push origin HEAD:chatgpt-tmp-yt-dlp-20260819
