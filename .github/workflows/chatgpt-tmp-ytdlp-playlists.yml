name: chatgpt-temp-ytdlp-playlists

on:
  pull_request:
    branches:
      - main

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Extract playlists twice and emit compact evidence
        shell: bash
        run: |
          set -euo pipefail
          P1='https://youtube.com/playlist?list=PLIV1G--hNI58vN4-NJ33JuE2JNDc8Bq4G'
          P2='https://youtube.com/playlist?list=PL8zgWQ7EPbOdRn7mXLWoa0DqfbcIbJnjx'

          yt-dlp --flat-playlist --ignore-errors --dump-single-json "$P1" > p1-full.json
          yt-dlp --flat-playlist --ignore-errors --dump-single-json --compat-options no-youtube-unavailable-videos "$P1" > p1-available.json
          yt-dlp --flat-playlist --ignore-errors --dump-single-json "$P2" > p2-full.json
          yt-dlp --flat-playlist --ignore-errors --dump-single-json --compat-options no-youtube-unavailable-videos "$P2" > p2-available.json

          python - <<'PY'
          import base64, gzip, json

          def load(path):
              with open(path, 'r', encoding='utf-8') as f:
                  return json.load(f)

          def entry_list(data):
              out = []
              for pos, e in enumerate(data.get('entries') or [], 1):
                  if not e:
                      out.append({'position': pos, 'id': None, 'title': None})
                      continue
                  out.append({
                      'position': pos,
                      'id': e.get('id'),
                      'title': e.get('title'),
                      'availability': e.get('availability'),
                      'url': e.get('url'),
                  })
              return out

          result = {}
          for key in ('p1', 'p2'):
              full = load(f'{key}-full.json')
              avail = load(f'{key}-available.json')
              result[key] = {
                  'playlist_id': full.get('id'),
                  'playlist_title': full.get('title'),
                  'full': entry_list(full),
                  'available': entry_list(avail),
              }

          raw = json.dumps(result, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
          encoded = base64.b64encode(gzip.compress(raw, compresslevel=9)).decode('ascii')
          print('CHATGPT_YTDLP_EVIDENCE_BEGIN')
          print(encoded)
          print('CHATGPT_YTDLP_EVIDENCE_END')
          print('COUNTS', json.dumps({k: {'full': len(v['full']), 'available': len(v['available'])} for k, v in result.items()}))
          PY

      - name: Mark completion
        run: echo extraction-complete
