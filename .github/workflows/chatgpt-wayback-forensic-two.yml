name: ChatGPT Wayback forensic two

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/chatgpt-wayback-forensic-two.yml

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Search alternate Wayback surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pages out/thumbs
          cat > forensic.py <<'PY'
          import concurrent.futures as cf
          import html, json, pathlib, re, time, urllib.error, urllib.parse, urllib.request

          IDS=['9R_VzlxPyzA','PQJ8y--y16k']
          PLAYLIST='PLIV1G--hNI58vN4-NJ33JuE2JNDc8Bq4G'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'

          def fetch(url, timeout=18):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'*/*'})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      return r.status,r.geturl(),r.headers.get('content-type',''),r.read()
              except urllib.error.HTTPError as e:
                  try:b=e.read()
                  except:b=b''
                  return e.code,e.geturl(),e.headers.get('content-type','') if e.headers else '',b
              except Exception as e:
                  return 0,url,'',str(e).encode()

          def cdx(url, prefix=False, limit=100, filters=None, collapse=None):
              p=[('url',url),('output','json'),('fl','timestamp,original,statuscode,mimetype,digest,length'),('limit',str(limit))]
              if prefix:p.append(('matchType','prefix'))
              for f in filters or []:p.append(('filter',f))
              if collapse:p.append(('collapse',collapse))
              api='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode(p)
              st,fin,ct,b=fetch(api,22)
              try:j=json.loads(b)
              except:j=[]
              rows=j[1:] if isinstance(j,list) and j and isinstance(j[0],list) else []
              return {'api':api,'http':st,'rows':rows,'raw':b.decode('utf-8','ignore')[:5000]}

          def title_signals(b):
              s=b.decode('utf-8','ignore')
              sig=[]
              pats=[
                ('html_title',r'<title[^>]*>(.*?)</title>'),
                ('og_title',r'<meta[^>]+(?:property|name)=["\']og:title["\'][^>]+content=["\']([^"\']+)["\']'),
                ('meta_title',r'<meta[^>]+name=["\']title["\'][^>]+content=["\']([^"\']+)["\']'),
                ('eow_title',r'id=["\']eow-title["\'][^>]+title=["\']([^"\']+)["\']'),
                ('primary_title',r'"videoPrimaryInfoRenderer"\s*:\s*\{.*?"title"\s*:\s*\{"runs"\s*:\s*\[\{"text"\s*:\s*"((?:\\.|[^"\\])*)"'),
                ('overlay_title',r'"playerOverlayVideoDetailsRenderer"\s*:\s*\{.*?"title"\s*:\s*\{"simpleText"\s*:\s*"((?:\\.|[^"\\])*)"'),
              ]
              for label,p in pats:
                  m=re.search(p,s,re.I|re.S)
                  if not m:continue
                  v=m.group(1)
                  if label in ('primary_title','overlay_title'):
                      try:v=json.loads('"'+v+'"')
                      except:pass
                  v=html.unescape(re.sub(r'\s+',' ',v)).strip()
                  if v and v not in [x[1] for x in sig]:sig.append([label,v])
              return sig

          result={'ids':{},'playlist':{}}
          for vid in IDS:
              urls=[
                f'https://www.youtube.com/watch?v={vid}',f'http://www.youtube.com/watch?v={vid}',
                f'https://youtube.com/watch?v={vid}',f'http://youtube.com/watch?v={vid}',
                f'https://m.youtube.com/watch?v={vid}',f'http://m.youtube.com/watch?v={vid}',
                f'https://youtu.be/{vid}',f'http://youtu.be/{vid}',
                f'https://www.youtube.com/embed/{vid}',f'http://www.youtube.com/embed/{vid}',
                f'https://www.youtube.com/shorts/{vid}',f'https://music.youtube.com/watch?v={vid}',
                f'https://www.youtube.com/watch?app=desktop&v={vid}',
                f'https://www.youtube.com/watch?v={vid}&feature=youtu.be',
                f'https://www.youtube.com/get_video_info?video_id={vid}',
                f'http://www.youtube.com/get_video_info?video_id={vid}',
                'https://www.youtube.com/oembed?'+urllib.parse.urlencode({'url':f'https://www.youtube.com/watch?v={vid}','format':'json'}),
                'https://www.youtube.com/oembed?'+urllib.parse.urlencode({'url':f'http://www.youtube.com/watch?v={vid}','format':'json'}),
                f'wayback-fakeurl.archive.org/yt/{vid}',
              ]
              qs=[]
              def one(u):
                  return u,cdx(u, prefix=(('/embed/' in u) or ('/shorts/' in u)), limit=100, collapse='digest')
              with cf.ThreadPoolExecutor(max_workers=6) as ex:
                  for u,q in ex.map(one,urls):qs.append({'surface':u,**q})
              hits=[]
              for q in qs:
                  for r in q['rows']:
                      if len(r)>=2:hits.append((r[0],r[1],q['surface'],r))
              # fetch distinct earliest useful hit from each unique original URL
              seen=set(); selected=[]
              for ts,orig,surface,row in sorted(hits):
                  k=(ts,orig)
                  if k not in seen:
                      seen.add(k);selected.append((ts,orig,surface,row))
              page_checks=[]
              def check(x):
                  ts,orig,surface,row=x
                  replay=f'https://web.archive.org/web/{ts}id_/{orig}'
                  st,fin,ct,b=fetch(replay,20)
                  sig=title_signals(b)
                  text=b.decode('utf-8','ignore')
                  id_mentions=text.count(vid)
                  out={'timestamp':ts,'original':orig,'surface':surface,'http':st,'final':fin,'type':ct,'bytes':len(b),'id_mentions':id_mentions,'signals':sig}
                  if b and len(b)<3_000_000:
                      pathlib.Path(f'out/pages/{vid}_{ts}_{abs(hash(orig))}.bin').write_bytes(b)
                  return out
              with cf.ThreadPoolExecutor(max_workers=6) as ex:
                  for x in ex.map(check,selected[:30]):page_checks.append(x)

              # Thumbnail history, any hostname/quality under i.ytimg path.
              thumb_queries=[]
              for host in ['i.ytimg.com','img.youtube.com','i1.ytimg.com','i2.ytimg.com','i3.ytimg.com','i4.ytimg.com']:
                  thumb_queries.append(cdx(f'{host}/vi/{vid}/',prefix=True,limit=100,filters=['statuscode:200'],collapse='digest'))
              th=[]
              for q in thumb_queries:
                  th.extend(q['rows'])
              th=sorted({(r[0],r[1]):tuple(r) for r in th if len(r)>=2}.values(),key=lambda r:r[0])
              thumb_fetch=[]
              for r in th[:10]:
                  ts,orig=r[0],r[1]
                  replay=f'https://web.archive.org/web/{ts}id_/{orig}'
                  st,fin,ct,b=fetch(replay,18)
                  name=f'out/thumbs/{vid}_{ts}_{pathlib.Path(urllib.parse.urlparse(orig).path).name or "image"}'
                  if b:pathlib.Path(name).write_bytes(b)
                  thumb_fetch.append({'timestamp':ts,'original':orig,'http':st,'type':ct,'bytes':len(b),'file':name if b else None})

              result['ids'][vid]={'queries':qs,'unique_hits':len(selected),'pages':page_checks,'thumbnail_cdx_count':len(th),'thumbnails':thumb_fetch}
              print('\nID',vid,'unique URL captures',len(selected),'thumbnail captures',len(th))
              for p in page_checks:
                  if p['signals'] or p['id_mentions']:
                      print(' PAGE',json.dumps(p,ensure_ascii=False))
              for t in thumb_fetch:print(' THUMB',json.dumps(t,ensure_ascii=False))

          # Archived playlist pages. Query several canonical historical variants.
          purls=[
            f'https://www.youtube.com/playlist?list={PLAYLIST}',f'http://www.youtube.com/playlist?list={PLAYLIST}',
            f'https://youtube.com/playlist?list={PLAYLIST}',f'http://youtube.com/playlist?list={PLAYLIST}',
            f'https://m.youtube.com/playlist?list={PLAYLIST}',f'http://m.youtube.com/playlist?list={PLAYLIST}',
          ]
          prows=[];pqueries=[]
          with cf.ThreadPoolExecutor(max_workers=6) as ex:
              futs=[ex.submit(cdx,u,False,500,['statuscode:200'],'digest') for u in purls]
              for u,f in zip(purls,futs):
                  q=f.result();pqueries.append({'surface':u,**q});prows.extend(q['rows'])
          uniq={}
          for r in prows:
              if len(r)>=2:uniq[(r[0],r[1])]=r
          prows=sorted(uniq.values(),key=lambda r:r[0])
          # sample all if <= 80, else earliest/latest plus evenly spaced
          if len(prows)<=80:sample=prows
          else:
              idx=set(list(range(20))+list(range(len(prows)-20,len(prows))))
              for k in range(40):idx.add(round(k*(len(prows)-1)/39))
              sample=[prows[i] for i in sorted(idx)]
          def pcheck(r):
              ts,orig=r[0],r[1]; replay=f'https://web.archive.org/web/{ts}id_/{orig}'
              st,fin,ct,b=fetch(replay,20); text=b.decode('utf-8','ignore')
              findings={vid:text.count(vid) for vid in IDS}
              contexts={}
              for vid,c in findings.items():
                  if c:
                      arr=[];pos=0
                      for _ in range(min(c,10)):
                          j=text.find(vid,pos)
                          if j<0:break
                          arr.append(text[max(0,j-800):j+1500].replace('\n',' ')[:2300])
                          pos=j+len(vid)
                      contexts[vid]=arr
              return {'timestamp':ts,'original':orig,'http':st,'bytes':len(b),'findings':findings,'contexts':contexts}
          pc=[]
          with cf.ThreadPoolExecutor(max_workers=6) as ex:
              for z in ex.map(pcheck,sample):pc.append(z)
          result['playlist']={'queries':pqueries,'capture_count':len(prows),'checked':len(sample),'pages':pc}
          print('\nPLAYLIST captures',len(prows),'checked',len(sample))
          for p in pc:
              if any(p['findings'].values()):print(' PLAYLIST_HIT',json.dumps(p,ensure_ascii=False)[:10000])

          pathlib.Path('out/forensic.json').write_text(json.dumps(result,indent=2,ensure_ascii=False))
          PY
          python3 forensic.py | tee out/summary.txt
      - name: Upload forensic evidence
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-wayback-forensic-two
          path: out/
          retention-days: 3
          if-no-files-found: error
