name: ChatGPT S Diff

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q --upgrade yt-dlp
