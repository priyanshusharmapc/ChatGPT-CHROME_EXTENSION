          import json
          from pathlib import Path
          old=[x.strip() for x in Path('old_ids.txt').read_text().strip().split(',') if x.strip()]
          cur=[]
          titles={}
          for line in Path('current.jsonl').read_text(encoding='utf-8').splitlines():
              x=json.loads(line); vid=x.get('id')
              if vid:
                  cur.append(vid); titles[vid]=x.get('title')
          oldset=set(old); curset=set(cur)
          add=[{'id':v,'title':titles.get(v),'index':cur.index(v)+1} for v in cur if v not in oldset]
          rem=[{'id':v,'old_index':old.index(v)+1} for v in old if v not in curset]
          pure=(len(add)==1 and not rem and cur[1:]==old and cur[0]==add[0]['id'])
          print('DIFF_RESULT',json.dumps({'old_count':len(old),'current_count':len(cur),'additions':add,'removals':rem,'pure_prepend':pure},ensure_ascii=False))
          PY
